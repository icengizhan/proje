version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: secure-notes-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: secure_notes
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./secure-notes-backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    container_name: secure-notes-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./secure-notes-backend
      dockerfile: Dockerfile
    container_name: secure-notes-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - DB_DATABASE=secure_notes
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=k8Xp2sN7vQ4wL9mR3jF6hB1dY5cA0eT8uG2iO7lZ4xW9nK3pJ6qM1bV5fH8yD
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: ./secure-notes-frontend
      dockerfile: Dockerfile
    container_name: secure-notes-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
